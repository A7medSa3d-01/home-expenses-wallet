<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student 1 · Home Expenses Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span class="brand-name">Expenses Wallet</span>
      </div>
      <ul class="nav-list" role="list" style="list-style:none; margin:0; padding:0;">
        <li><a class="nav-link" href="index.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-5.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V20"/></svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a></li>
        <li><a class="nav-link" href="student1.html">
          <span class="nav-avatar" id="navStudent1Avatar" aria-hidden="true">S</span>
          <span class="nav-label" id="navStudent1Label">Student 1</span>
        </a></li>
        <li><a class="nav-link" href="student2.html">
          <span class="nav-avatar" id="navStudent2Avatar" aria-hidden="true">S</span>
          <span class="nav-label" id="navStudent2Label">Student 2</span>
        </a></li>
        <li><a class="nav-link" href="lessons-settings.html">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v14.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 0 4 22"/><path d="M4 5.5v14A2.5 2.5 0 0 0 6.5 22"/><path d="M8 8h8M8 11.5h8"/></svg>
          </span>
          <span class="nav-label">Lessons Settings</span>
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch to dark mode">🌙</button>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 id="studentHeading">Student 1</h1>
          <p class="page-subtitle">Lesson fees and monthly payment status.</p>
        </div>
      </div>

      <section class="panel" aria-label="Lessons for selected month">
        <div class="panel-header student-month-nav">
          <span class="calendar-month-label" id="studentMonthLabel"></span>
          <div class="calendar-nav">
            <button type="button" id="studentPrevMonthBtn" class="icon-btn" aria-label="Previous month">‹</button>
            <button type="button" id="studentNextMonthBtn" class="icon-btn" aria-label="Next month">›</button>
          </div>
        </div>
        <div id="lessonsList"></div>
        <div class="student-total-bar">
          <span class="summary-label">Paid Lessons Total</span>
          <span class="summary-value" id="studentMonthTotal">0</span>
        </div>
      </section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/students.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navStudent1Label').textContent = Storage.getStudentName('student1');
      document.getElementById('navStudent2Label').textContent = Storage.getStudentName('student2');
      document.getElementById('navStudent1Avatar').textContent = Storage.getStudentName('student1').charAt(0).toUpperCase();
      document.getElementById('navStudent2Avatar').textContent = Storage.getStudentName('student2').charAt(0).toUpperCase();
      StudentPage.init('student1');
    });
  </script>
</body>
</html>
