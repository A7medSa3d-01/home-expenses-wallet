<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student 1 · Home Expenses Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark">🏠</span>
        <span class="brand-name">Expenses Wallet</span>
      </div>
      <ul class="nav-list" role="list" style="list-style:none; margin:0; padding:0;">
        <li><a class="nav-link" href="index.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a></li>
        <li><a class="nav-link" href="student1.html"><span class="nav-icon">👨‍🎓</span><span class="nav-label" id="navStudent1Label">Student 1</span></a></li>
        <li><a class="nav-link" href="student2.html"><span class="nav-icon">👩‍🎓</span><span class="nav-label" id="navStudent2Label">Student 2</span></a></li>
        <li><a class="nav-link" href="lessons-settings.html"><span class="nav-icon">📚</span><span class="nav-label">Lessons Settings</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch to dark mode">🌙</button>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 id="studentHeading">Student 1</h1>
          <p class="page-subtitle">Lesson fees and monthly payment status.</p>
        </div>
      </div>

      <section class="panel" aria-label="Lessons for selected month">
        <div class="panel-header student-month-nav">
          <span class="calendar-month-label" id="studentMonthLabel"></span>
          <div class="calendar-nav">
            <button type="button" id="studentPrevMonthBtn" class="icon-btn" aria-label="Previous month">‹</button>
            <button type="button" id="studentNextMonthBtn" class="icon-btn" aria-label="Next month">›</button>
          </div>
        </div>
        <div id="lessonsList"></div>
        <div class="student-total-bar">
          <span class="summary-label">Paid Lessons Total</span>
          <span class="summary-value" id="studentMonthTotal">0</span>
        </div>
      </section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/students.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navStudent1Label').textContent = Storage.getStudentName('student1');
      document.getElementById('navStudent2Label').textContent = Storage.getStudentName('student2');
      StudentPage.init('student1');
    });
  </script>
</body>
</html>
