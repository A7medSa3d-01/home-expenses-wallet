<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons Settings · Home Expenses Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark">🏠</span>
        <span class="brand-name">Expenses Wallet</span>
      </div>
      <ul class="nav-list" role="list" style="list-style:none; margin:0; padding:0;">
        <li><a class="nav-link" href="index.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a></li>
        <li><a class="nav-link" href="student1.html"><span class="nav-icon">👨‍🎓</span><span class="nav-label" id="navStudent1Label">Student 1</span></a></li>
        <li><a class="nav-link" href="student2.html"><span class="nav-icon">👩‍🎓</span><span class="nav-label" id="navStudent2Label">Student 2</span></a></li>
        <li><a class="nav-link" href="lessons-settings.html"><span class="nav-icon">📚</span><span class="nav-label">Lessons Settings</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button type="button" id="themeToggle" class="icon-btn" aria-label="Switch to dark mode">🌙</button>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Lessons Settings</h1>
          <p class="page-subtitle">Manage student names and their monthly lesson fees.</p>
        </div>
      </div>

      <section class="panel" aria-label="Student names">
        <div class="panel-header">
          <h2>Students</h2>
        </div>
        <div id="studentsPanel"></div>
      </section>

      <section class="panel" aria-label="Lessons per student">
        <div class="panel-header">
          <h2>Lessons</h2>
        </div>
        <div id="lessonsPanel" class="lessons-panel-grid"></div>
      </section>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navStudent1Label').textContent = Storage.getStudentName('student1');
      document.getElementById('navStudent2Label').textContent = Storage.getStudentName('student2');
      LessonsSettings.init();
    });
  </script>
</body>
</html>
